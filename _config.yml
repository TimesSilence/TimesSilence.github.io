# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Dai Wei
subtitle: 个人技术网站
description: 记录软件开发、工程实践与技术思考。
keywords: 软件开发,工程实践,Java,Web,开源
author: Dai Wei
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.daiwei.biz
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 技术
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: butterfly

# Local search (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

feed:
  type: atom
  path: atom.xml
  limit: 20

# Deployment
## GitHub Pages: use the workflow in .github/workflows/pages.yml
## or: npm i hexo-deployer-git && hexo deploy
deploy:
  type: ''
